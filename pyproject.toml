[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",    
    "W",    
    "F",    
    "I",   
    "B",    
    "UP",   
    "SIM",  
    "C4",   
]
ignore = [
    "E501",  
    "B008",  
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "I", "UP"]   
"tests/*" = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]